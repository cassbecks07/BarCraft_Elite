name: Compilar APK BarCraft

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Compilar Web a APK nativo automático
        uses: jaywcjlove/github-action-android-build-apk@main
        with:
          path: index.html
          package_name: "com.gustavosuarez.barcraft"
          app_name: "BarCraft Elite"

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: BarCraft-Elite-APK
          path: |
            *.apk
            app/build/outputs/apk/**/*.apk
