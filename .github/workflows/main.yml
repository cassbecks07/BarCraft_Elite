name: Compilar APK BarCraft

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Java y Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto Android desde HTML y Logo
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/java/com/gustavosuarez/barcraft
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "app/src/main/res/$d"
          done

          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          elif [ -f "index-v2.html" ]; then
            cp index-v2.html app/src/main/assets/index.html
          else
            echo "No se encontró index.html ni index-v2.html"
            exit 1
          fi

          ICON_FILE=""
          if [ -f "logo.jpg" ]; then
            ICON_FILE="logo.jpg"
          elif [ -f "logo.png" ]; then
            ICON_FILE="logo.png"
          fi

          if [ -n "$ICON_FILE" ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp "$ICON_FILE" "app/src/main/res/$d/ic_launcher.jpg"
              cp "$ICON_FILE" "app/src/main/res/$d/ic_launcher_round.jpg"
            done
          fi

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.USE_FINGERPRINT" />

              <application
                  android:allowBackup="true"
                  android:label="BarCraft Elite"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/gustavosuarez/barcraft/MainActivity.java
          package com.gustavosuarez.barcraft;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.annotation.NonNull;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.Executor;

          public class MainActivity extends FragmentActivity {
              private static final int REQ_STORAGE = 1001;
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private byte[] pendingExportBytes;

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
                      registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                              Intent data = result.getData();
                              if (data.getData() != null) {
                                  results = new Uri[]{data.getData()};
                              } else if (data.getClipData() != null && data.getClipData().getItemCount() > 0) {
                                  int count = data.getClipData().getItemCount();
                                  results = new Uri[count];
                                  for (int i = 0; i < count; i++) {
                                      results[i] = data.getClipData().getItemAt(i).getUri();
                                  }
                              }
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      });

              private final ActivityResultLauncher<Intent> createFileLauncher =
                      registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), result -> {
                          byte[] dataToWrite = pendingExportBytes;
                          pendingExportBytes = null;

                          if (result.getResultCode() == RESULT_OK && result.getData() != null && dataToWrite != null) {
                              Uri targetUri = result.getData().getData();
                              if (targetUri != null) {
                                  try (OutputStream os = getContentResolver().openOutputStream(targetUri)) {
                                      if (os != null) {
                                          os.write(dataToWrite);
                                          os.flush();
                                          notifyExportResult(true, "Archivo guardado correctamente");
                                          return;
                                      }
                                  } catch (Exception e) {
                                      notifyExportResult(false, "Error al guardar: " + e.getMessage());
                                      return;
                                  }
                              }
                          }
                          notifyExportResult(false, "Exportación cancelada");
                      });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams fileChooserParams) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                              filePathCallback = null;
                          }
                          filePathCallback = callback;

                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);

                          String[] acceptTypes = fileChooserParams.getAcceptTypes();
                          if (acceptTypes != null && acceptTypes.length > 0 && acceptTypes[0] != null && !acceptTypes[0].isEmpty()) {
                              if (acceptTypes.length == 1) {
                                  intent.setType(acceptTypes[0]);
                              } else {
                                  intent.setType("*/*");
                                  intent.putExtra(Intent.EXTRA_MIME_TYPES, acceptTypes);
                              }
                          } else {
                              intent.setType("*/*");
                          }

                          if (fileChooserParams.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) {
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          }

                          try {
                              fileChooserLauncher.launch(intent);
                              return true;
                          } catch (Exception e) {
                              if (filePathCallback != null) {
                                  filePathCallback.onReceiveValue(null);
                                  filePathCallback = null;
                              }
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void notifyExportResult(boolean ok, String message) {
                  String safeMsg = message == null ? "" : message.replace("\\", "\\\\").replace("'", "\\'");
                  final String js = "if (window.onNativeExportResult) { window.onNativeExportResult(" + ok + ", '" + safeMsg + "'); }";
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }

              private void sendPermissionResult(String type, boolean granted) {
                  final String js = "if (window.onNativePermissionResult) { window.onNativePermissionResult('" + type + "', " + granted + "); }";
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_STORAGE) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      sendPermissionResult("storage", granted);
                  }
              }

              private void showBiometricPrompt() {
                  BiometricManager biometricManager = BiometricManager.from(this);
                  int authenticators = BiometricManager.Authenticators.BIOMETRIC_STRONG
                          | BiometricManager.Authenticators.BIOMETRIC_WEAK
                          | BiometricManager.Authenticators.DEVICE_CREDENTIAL;

                  int canAuth = biometricManager.canAuthenticate(authenticators);
                  if (canAuth != BiometricManager.BIOMETRIC_SUCCESS) {
                      sendPermissionResult("biometric", false);
                      return;
                  }

                  Executor executor = ContextCompat.getMainExecutor(this);
                  BiometricPrompt biometricPrompt = new BiometricPrompt(
                          this,
                          executor,
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(@NonNull BiometricPrompt.AuthenticationResult result) {
                                  super.onAuthenticationSucceeded(result);
                                  sendPermissionResult("biometric", true);
                              }

                              @Override
                              public void onAuthenticationError(int errorCode, @NonNull CharSequence errString) {
                                  super.onAuthenticationError(errorCode, errString);
                                  sendPermissionResult("biometric", false);
                              }

                              @Override
                              public void onAuthenticationFailed() {
                                  super.onAuthenticationFailed();
                              }
                          }
                  );

                  BiometricPrompt.PromptInfo promptInfo = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("Autenticación Biométrica")
                          .setSubtitle("Confirma tu huella o desbloqueo para BarCraft Elite")
                          .setAllowedAuthenticators(authenticators)
                          .build();

                  biometricPrompt.authenticate(promptInfo);
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void exportTextFile(String fileName, String mimeType, String content) {
                      runOnUiThread(() -> {
                          pendingExportBytes = (content != null ? content : "").getBytes(StandardCharsets.UTF_8);
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType(mimeType != null && !mimeType.isEmpty() ? mimeType : "application/json");
                          intent.putExtra(Intent.EXTRA_TITLE, fileName != null && !fileName.isEmpty() ? fileName : "barcraft-export.json");
                          createFileLauncher.launch(intent);
                      });
                  }

                  @JavascriptInterface
                  public void exportBase64File(String fileName, String mimeType, String base64Data) {
                      runOnUiThread(() -> {
                          try {
                              String cleanBase64 = base64Data != null && base64Data.contains(",")
                                      ? base64Data.substring(base64Data.indexOf(",") + 1)
                                      : (base64Data != null ? base64Data : "");
                              pendingExportBytes = Base64.decode(cleanBase64, Base64.DEFAULT);
                              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType(mimeType != null && !mimeType.isEmpty() ? mimeType : "application/octet-stream");
                              intent.putExtra(Intent.EXTRA_TITLE, fileName != null && !fileName.isEmpty() ? fileName : "barcraft-backup");
                              createFileLauncher.launch(intent);
                          } catch (Exception e) {
                              pendingExportBytes = null;
                              notifyExportResult(false, "Error al decodificar archivo: " + e.getMessage());
                          }
                      });
                  }

                  @JavascriptInterface
                  public void requestStoragePermission() {
                      runOnUiThread(() -> {
                          if (Build.VERSION.SDK_INT >= 33) {
                              if (checkSelfPermission(Manifest.permission.READ_MEDIA_IMAGES) == PackageManager.PERMISSION_GRANTED) {
                                  sendPermissionResult("storage", true);
                              } else {
                                  requestPermissions(new String[]{Manifest.permission.READ_MEDIA_IMAGES}, REQ_STORAGE);
                              }
                          } else if (Build.VERSION.SDK_INT >= 23) {
                              if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED) {
                                  sendPermissionResult("storage", true);
                              } else {
                                  requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE}, REQ_STORAGE);
                              }
                          } else {
                              sendPermissionResult("storage", true);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void requestBiometricAuth() {
                      runOnUiThread(() -> showBiometricPrompt());
                  }
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = 'BarCraftElite'
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gustavosuarez.barcraft'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.gustavosuarez.barcraft'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.biometric:biometric:1.1.0'
              implementation 'androidx.fragment:fragment:1.6.2'
              implementation 'androidx.activity:activity:1.8.2'
              constraints {
                  implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
                      because 'evitar clases duplicadas con kotlin-stdlib-jdk7 y jdk8 anteriores a 1.8.0'
                  }
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
                      because 'unificar version de kotlin stdlib'
                  }
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
                      because 'unificar version de kotlin stdlib'
                  }
              }
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Configurar Gradle Wrapper
        run: |
          set -e
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type all
          fi
          chmod +x ./gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug

      - name: Subir APK compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: barcraft-elite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
