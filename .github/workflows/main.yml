name: Compilar APK BarCraft

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Crear estructura manual para Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp index.html android/app/src/main/assets/public/index.html
          
          npm init -y
          npm install @capacitor/core @capacitor/android
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gustavosuarez.barcraft",
            "appName": "BarCraft Elite",
            "webDir": "android/app/src/main/assets/public",
            "bundledWebRuntime": false
          }
          EOF

      - name: Compilar con Gradle
        run: |
          cd android
          gradle wrapper || true
          chmod +x gradlew || true
          ./gradlew assembleDebug || npx @capacitor/android update
