name: Compilar APK BarCraft

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor y generar proyecto Android
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          mkdir -p www
          cp index.html www/
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gustavosuarez.barcraft",
            "appName": "BarCraft Elite",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: BarCraft-Elite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
