name: Compilar APK BarCraft

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar y compilar con Capacitor CLI
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx @capacitor/cli init "BarCraft Elite" "com.gustavosuarez.barcraft" --web-dir index.html
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: Dar permisos y compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: BarCraft-Elite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
