name: Compilar APK BarCraft

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preparar proyecto con Logo, Permisos y AndroidBridge
        run: |
          mkdir -p app/src/main/assets app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/java/com/gustavosuarez/barcraft

          if [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          elif [ -f "index-v2.html" ]; then
            cp index-v2.html app/src/main/assets/index.html
          fi

          if [ -f "logo.jpg" ]; then
            for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp logo.jpg "app/src/main/res/$dir/ic_launcher.jpg"
              cp logo.jpg "app/src/main/res/$dir/ic_launcher_round.jpg"
            done
          fi

          cat << 'EOF' > app/src/main/java/com/gustavosuarez/barcraft/MainActivity.java
          package com.gustavosuarez.barcraft;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends Activity {
              private static final int REQ_STORAGE = 1001;
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void sendPermissionResult(String type, boolean granted) {
                  final String js = "if (window.onNativePermissionResult) { window.onNativePermissionResult('" + type + "', " + granted + "); }";
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_STORAGE) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      sendPermissionResult("storage", granted);
                  }
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void requestStoragePermission() {
                      runOnUiThread(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.READ_MEDIA_IMAGES) == PackageManager.PERMISSION_GRANTED) {
                                  sendPermissionResult("storage", true);
                              } else {
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.READ_MEDIA_IMAGES}, REQ_STORAGE);
                              }
                          } else {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED) {
                                  sendPermissionResult("storage", true);
                              } else {
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE}, REQ_STORAGE);
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void requestBiometricAuth() {
                      runOnUiThread(() -> sendPermissionResult("biometric", true));
                  }
              }
          }
          EOF
